# Pull the current season's new races every Monday and commit them, so the live
# app and its models keep up without anyone remembering to. In October 2026 the
# data was found five rounds behind, with a results cache frozen since June —
# both discovered only because someone came back and asked.
#
# The full test suite runs before anything is committed, and every builder
# refuses to shrink a dataset, so a bad pull fails red instead of landing.
#
# Lap timing is NOT pulled here: F1 blocks datacenter IPs, GitHub's included,
# so it is pulled from a home connection with scripts/refresh_laps.ps1.
name: Refresh race data

on:
  schedule:
    - cron: "0 6 * 3-12 1"   # Mondays, March-December: after each race weekend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes          # shared with preregister.yml; both push to main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[app,dev]" scikit-learn xgboost

      # Carry only the small per-race parquets between runs (a few MB); the
      # FastF1 HTTP cache runs to gigabytes. Saved even when the job fails —
      # `actions/cache` alone saves only on success, so a failing job restarted
      # from nothing every week and could never make progress.
      - uses: actions/cache/restore@v4
        with:
          path: data/processed/by_race*
          key: by-race-${{ github.run_id }}
          restore-keys: by-race-

      # Results, sprints and qualifying come from the public results API, so they
      # never depend on lap timing. Kept as their own step so the half that works
      # without an account always lands: standings, Race Hub, the podium model
      # and pre-registration all run on these alone.
      - name: Pull results and sprints
        run: |
          set -e
          python -m f1se.standalone.results "$(date -u +%Y)"
          python -m f1se.standalone.results sprints "$(date -u +%Y)"

      # Lap timing (strategy, degradation, safety car, pit loss) is not pulled
      # here. F1's timing archive needs an F1 TV account since October 2026, and
      # even with one it answers GitHub-hosted runners with a CloudFront 403
      # before checking the token: F1 blocks datacenter IPs (FastF1 issue #988,
      # closed by the maintainer as out of FastF1's hands). Run #7, on 22 Nov,
      # signed in successfully and then failed all 23 races. It runs from a home
      # connection instead: scripts/refresh_laps.ps1.

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/processed/by_race*
          key: by-race-${{ github.run_id }}

      - name: Test
        run: pytest -q

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -m "Data: weekly refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
